name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # Question set for the support chat; fails the deploy if answers regress.
      - run: npm run test:support
      # Server routes can't run on static hosting; signup uses NEXT_PUBLIC_SIGNUP_ENDPOINT instead.
      - run: rm -rf app/api support-api
      - run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_SIGNUP_ENDPOINT: ${{ vars.SIGNUP_ENDPOINT }}
          # Full URL of the AI support proxy (support-api/ on Vercel), e.g. https://<project>.vercel.app/api/chat.
          # Unset = the chat uses the built-in keyword matcher.
          NEXT_PUBLIC_SUPPORT_API_URL: ${{ vars.SUPPORT_API_URL }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
